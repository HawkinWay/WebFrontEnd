<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Door</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: #f5f5f5;
            padding: 40px;
        }

        .sidenav{
            position: relative;
            width: 234px;
            height: 420px;
        }
        
        ul{
            width: 100%;
            height: 100%;
            background-color: #a3a3a3;
            list-style: none;
            padding: 20px 0;
        }

        li{
            position: static;
        }

        a{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            height: 42px;
            color: #ffffff;
            font-size: 14px;
            text-decoration: none;
            transition: background 0.2s;
        }

        a:hover{
            background-color: #ff6700;
        }

        .submenu{
            display: none;
            position: absolute;
            left: 234px;
            top: 0;
            width: 700px;
            height: 100%;
            background-color: #ffffff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            padding: 20px;
        }

        li:hover .submenu{
            display: block;
        }

        .card{
            color: #333;
            padding: 10px;
            font-size: 14px;
        }

    </style>
</head>
<body>
    <nav class="sidenav">
        <ul>
            <li>
                <a href="#">手机 <span class="arrow">></span></a>
                <div class="submenu">
                    <div class="card">南瓜手机</div>
                    <div class="card">小米手机</div>
                </div>
            </li>
            <li>
                <a href="#">电视 <span class="arrow">></span></a>
                <div class="submenu">
                    <div class="card">南瓜电视</div>
                    <div class="card">水果电视</div>
                </div>
            </li>
        </ul>
    </nav>
</body>
</html>
