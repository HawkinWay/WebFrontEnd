<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>冒泡排序</h1>
    </div>

    <script>
        function bubbleSort(arr){
            let n = arr.length;

            for(let i = 0; i < n - 1; i++){
                for(let j = 0; j < n - 1 - i; j++){
                    if(arr[j] > arr[j+1]){
                        let temp = arr[j];
                        arr[j] = arr[j+1];
                        arr[j+1] = temp;
                    }
                }
            }

            return arr;
        }

        let nums = [28, 2, 37, 114, 48, 258, 69];
        console.log("排序前: ", nums);
        let sortNums = bubbleSort(nums);
        console.log("排序后: ", sortNums);
    </script>
</body>
</html>
