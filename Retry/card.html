<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    <style>
        body{
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg,  #000000 40%, #747474 100%);
        }

        .card{
            border-radius: 14px;
            background-color: #5d5d5d;
            padding: 20px;
            margin: 40px;
            text-align: center;
        }

        .avatar img{
            border-radius: 50%;
            object-fit: cover;
            padding: 4px;
            border: none;
            transition: transform 0.3s;
        }

        .title p{
            margin-bottom: 40px;
        }

        .introduction .emoji ul{
            padding: 0;        
            display: flex;
            justify-content: center;
            list-style: none;
        }

        .introduction .emoji li{
            margin: 0 20px;
        }

        .contact a{
            display: block;
            text-decoration: none;
            color: #000000;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">
            <img src="https://static01.nyt.com/images/2012/07/20/arts/20dark/20dark-jumbo-v2.jpg" alt="头像" width="180" height="180">
        </div>

        <section class="title">
            <h2>百特曼</h2>
            <p>哥谭黑暗骑士</p>
        </section>

        <div class="introduction">
            <p>白天经营韦恩企业，晚上化身蝙蝠侠打击犯罪、维护哥谭市的安全</p>
            <div class="emoji">
                <ul>
                    <li>🦇</li>
                    <li>🤜🏻</li>
                    <li>🤡</li>
                </ul>
            </div>
            <div class="contact">
                <a href="#">✉️ BruceWayne@BW.com</a>
                <a href="#">🏢 Wayne Manor</a>
            </div>
        </div>
    </div>
</body>
</html>
