<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rating</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        .rating{
            font-size: 40px;
            cursor: pointer;
            display: inline-block;
        }

        .star{
            color: #ccc;
            transition: color 0.1s ease;
        }

        .star.active{
            color: #ffcc00;
        }
    </style>

    <script>
    $(document).ready(function(){
        $('.star').hover(
            function(){
                let currentIndex = parseInt($(this).attr('data-index'));
                $('.star').each(function(){
                    let starIndex = parseInt($(this).attr('data-index'));
                    if(starIndex <= currentIndex){
                        $(this).addClass('active');
                    }else{
                        $(this).removeClass('active');
                    }
                });
            },
            function(){
                $('.star').removeClass('active');
            }
        );
    });
    </script>
</head>
<body>
    <div class="rating">
        <span class="star" data-index="0">★</span>
        <span class="star" data-index="1">★</span>
        <span class="star" data-index="2">★</span>
        <span class="star" data-index="3">★</span>
        <span class="star" data-index="4">★</span>
    </div>
</body>
</html>
