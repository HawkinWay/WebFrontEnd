<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tooltips</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .tooltip-box{
            display: inline-block;
            background-color: #333;
            color: #fff;
            padding: 5px 10px;
            font-size: 12px;
            margin-left: 10px;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="tooltips">
        <span id="myspan">欢迎光临江苏反诈网</span>
    </div>

    <script>
        $(document).ready(function(){
            $('#myspan').hover(
                function(){
                    let tooltipHtml = "<span class='tooltip-box'>“I'm a tooltip”</span>";
                    $(this).after(tooltipHtml);
                },
                function() {
                    $(this).next(".tooltip-box").remove();
                }
            );
        });
    </script>
</body>
</html>
