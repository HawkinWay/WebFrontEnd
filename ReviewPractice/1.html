<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编程题1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .main-content{
            background-color: #e9ecef;
            min-height: 400px;
            padding: 20px;
            border-radius: 8px;
        }

        .sidebar{
            background-color: #dee2e6;
            min-height: 400px;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="row g-4">
            <!--大屏9列，小屏默认占满12列-->
            <div class="col-12 col-lg-9">
                <div class="main-content">
                    <h2>Main Content</h2>
                    <p>when >= 992px, width: 75%</p>
                    <p>when not, width: 100%</p>
                </div>
            </div>

            <!--侧边栏，大屏占3列 25%, 小屏默认占满12列-->
            <div class="col-12 col-lg-3">
                <div class="sidebar">
                    <h4>sidebar(col-lg-3)</h4>
                    <p>when >= 992px, width: 25%</p>
                    <p>when in small screen, below the main content</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
